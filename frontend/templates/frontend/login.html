{% extends "frontend/base.html" %}
{% block title %}Ingresar · Concesionario{% endblock %}
{% block body %}
<div class="container" style="max-width:380px; margin-top:12vh">
  <div class="card shadow-sm">
    <div class="card-body p-4">
      <h1 class="h4 mb-3">Concesionario</h1>
      <form id="form-login" autocomplete="on">
        <div class="mb-3">
          <label class="form-label" for="username">Usuario</label>
          <input class="form-control" id="username" name="username" autocomplete="username" required>
        </div>
        <div class="mb-3">
          <label class="form-label" for="password">Contraseña</label>
          <input class="form-control" id="password" name="password" type="password" autocomplete="current-password" required>
        </div>
        <div id="error" class="alert alert-danger py-2 d-none" role="alert"></div>
        <button class="btn btn-primary w-100" type="submit">Ingresar</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script>
document.getElementById('form-login').addEventListener('submit', async (e) => {
  e.preventDefault();
  const err = document.getElementById('error');
  err.classList.add('d-none');
  const r = await fetch('/api/v1/auth/token/', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({
      username: document.getElementById('username').value,
      password: document.getElementById('password').value,
    }),
  });
  if (r.ok) {
    const t = await r.json();
    sessionStorage.setItem('access', t.access);
    sessionStorage.setItem('refresh', t.refresh);
    location.href = '/';
  } else {
    err.textContent = r.status === 429 ? 'Demasiados intentos. Espere un minuto.' : 'Usuario o contraseña incorrectos.';
    err.classList.remove('d-none');
  }
});
</script>
{% endblock %}
